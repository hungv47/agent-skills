<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 130" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes dash-flow { to { stroke-dashoffset: -18; } }
    .flow { stroke-dasharray: 6 4; animation: dash-flow 1.2s linear infinite; }
  </style>
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/><stop offset="100%" stop-color="#efe9dc"/>
    </linearGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#faf6f0"/>
    </linearGradient>
    <filter id="ss" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#c4b8a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="540" height="130" rx="12" fill="url(#sg)" stroke="#ddd6c8" stroke-width="1" filter="url(#ss)"/>
  <text x="270" y="26" text-anchor="middle" font-size="12" fill="#8a7e6a" font-weight="700" letter-spacing="0.14em">STRATEGY</text>
  <text x="270" y="42" text-anchor="middle" font-size="10" fill="#b0a694">diagnose · prioritize · measure · test</text>

  <rect x="18" y="60" width="116" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="76" y="88" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">problem-analysis</text>

  <rect x="158" y="60" width="116" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="216" y="88" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">solution-design</text>

  <rect x="298" y="60" width="116" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="356" y="88" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">funnel-planner</text>

  <rect x="438" y="60" width="84" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="480" y="88" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">experiment</text>

  <line x1="134" y1="83" x2="158" y2="83" stroke="#c4b8a4" stroke-width="1.8" class="flow" marker-end="url(#sa)"/>
  <line x1="274" y1="83" x2="298" y2="83" stroke="#c4b8a4" stroke-width="1.8" class="flow" marker-end="url(#sa)"/>
  <line x1="414" y1="83" x2="438" y2="83" stroke="#c4b8a4" stroke-width="1.8" class="flow" marker-end="url(#sa)"/>
</svg>
