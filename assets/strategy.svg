<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 190" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes dash-flow { to { stroke-dashoffset: -18; } }
    .flow { stroke-dasharray: 6 4; animation: dash-flow 1.2s linear infinite; }
  </style>
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/><stop offset="100%" stop-color="#efe9dc"/>
    </linearGradient>
    <linearGradient id="sn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#faf6f0"/>
    </linearGradient>
    <filter id="ss" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#c4b8a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="540" height="190" rx="12" fill="url(#sg)" stroke="#ddd6c8" stroke-width="1" filter="url(#ss)"/>
  <text x="270" y="26" text-anchor="middle" font-size="12" fill="#8a7e6a" font-weight="700" letter-spacing="0.14em">STRATEGY</text>
  <text x="270" y="42" text-anchor="middle" font-size="10" fill="#b0a694">research · diagnose · prioritize · measure · test</text>

  <!-- Row 1: parallel inputs -->
  <rect x="18" y="56" width="130" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="83" y="84" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">market-research</text>

  <rect x="168" y="56" width="130" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="233" y="84" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">problem-analysis</text>

  <!-- Row 2: pipeline -->
  <rect x="108" y="126" width="126" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="171" y="154" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">solution-design</text>

  <rect x="260" y="126" width="116" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="318" y="154" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">funnel-planner</text>

  <rect x="402" y="126" width="110" height="46" rx="10" fill="url(#sn)" stroke="#d0c7b6" stroke-width="1" filter="url(#ss)"/>
  <text x="457" y="154" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">experiment</text>

  <!-- Arrows: row 1 → solution-design -->
  <path d="M 108 102 L 108 118 L 140 126" stroke="#c4b8a4" stroke-width="1.8" fill="none" class="flow" marker-end="url(#sa)"/>
  <path d="M 208 102 L 208 118 L 192 126" stroke="#c4b8a4" stroke-width="1.8" fill="none" class="flow" marker-end="url(#sa)"/>

  <!-- Arrows: pipeline -->
  <line x1="234" y1="149" x2="260" y2="149" stroke="#c4b8a4" stroke-width="1.8" class="flow" marker-end="url(#sa)"/>
  <line x1="376" y1="149" x2="402" y2="149" stroke="#c4b8a4" stroke-width="1.8" class="flow" marker-end="url(#sa)"/>
</svg>
