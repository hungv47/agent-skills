<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect width="520" height="180" rx="10" fill="#f0f4f6" stroke="#d4dee4" stroke-width="1"/>
  <text x="260" y="24" text-anchor="middle" font-size="11" fill="#8ba8b8" font-weight="600" letter-spacing="0.12em">COMMS</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#9ab4c4">research → plan → create → measure</text>

  <!-- Main pipeline -->
  <rect x="16" y="56" width="100" height="42" rx="8" fill="#ffffff" stroke="#b8ccd6" stroke-width="1"/>
  <circle cx="30" cy="70" r="4" fill="#d4a574"/>
  <text x="66" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">icp-research</text>

  <rect x="140" y="56" width="86" height="42" rx="8" fill="#ffffff" stroke="#b8ccd6" stroke-width="1"/>
  <text x="183" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">imc-plan</text>

  <rect x="250" y="56" width="108" height="42" rx="8" fill="#ffffff" stroke="#b8ccd6" stroke-width="1"/>
  <text x="304" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">content-create</text>

  <rect x="382" y="56" width="90" height="42" rx="8" fill="#ffffff" stroke="#b8ccd6" stroke-width="1"/>
  <text x="427" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">attribution</text>

  <line x1="116" y1="77" x2="140" y2="77" stroke="#9ab4c4" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="226" y1="77" x2="250" y2="77" stroke="#9ab4c4" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="358" y1="77" x2="382" y2="77" stroke="#9ab4c4" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Horizontal / standalone -->
  <text x="28" y="124" font-size="9" fill="#9ab4c4">standalone</text>
  <rect x="16" y="132" width="106" height="34" rx="7" fill="#ffffff" stroke="#b8ccd6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="69" y="153" text-anchor="middle" font-size="11" fill="#5a7080">lp-optimization</text>

  <rect x="134" y="132" width="56" height="34" rx="7" fill="#ffffff" stroke="#b8ccd6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="162" y="153" text-anchor="middle" font-size="11" fill="#5a7080">seo</text>

  <rect x="202" y="132" width="80" height="34" rx="7" fill="#ffffff" stroke="#b8ccd6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="242" y="153" text-anchor="middle" font-size="11" fill="#5a7080">humanize</text>

  <!-- Start here -->
  <rect x="24" y="44" width="62" height="14" rx="7" fill="#d4a574"/>
  <text x="55" y="54" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="600">START HERE</text>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#9ab4c4" stroke-width="1.5"/>
    </marker>
  </defs>
</svg>
