<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 194" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes dash-flow { to { stroke-dashoffset: -18; } }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
    .flow { stroke-dasharray: 6 4; animation: dash-flow 1.2s linear infinite; }
    .badge { animation: pulse 2s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#edf3f7"/><stop offset="100%" stop-color="#dbe8f0"/>
    </linearGradient>
    <linearGradient id="cn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f2f7fa"/>
    </linearGradient>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8a654"/><stop offset="100%" stop-color="#c4843a"/>
    </linearGradient>
    <filter id="cs" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8" fill="none" stroke="#7da8c0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="540" height="194" rx="12" fill="url(#cg)" stroke="#c4d4e0" stroke-width="1" filter="url(#cs)"/>
  <text x="270" y="26" text-anchor="middle" font-size="12" fill="#5a7e96" font-weight="700" letter-spacing="0.14em">COMMS</text>
  <text x="270" y="42" text-anchor="middle" font-size="10" fill="#7da8c0">research · plan · create · measure</text>

  <!-- Badge -->
  <rect x="24" y="52" width="72" height="18" rx="9" fill="url(#cb)" class="badge" filter="url(#cs)"/>
  <text x="60" y="64" text-anchor="middle" font-size="8" fill="#fff" font-weight="700" letter-spacing="0.06em">START HERE</text>

  <!-- Pipeline -->
  <rect x="18" y="76" width="104" height="46" rx="10" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" filter="url(#cs)"/>
  <circle cx="34" cy="99" r="5" fill="#d4a050" opacity="0.9"/>
  <text x="68" y="104" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">icp-research</text>

  <rect x="148" y="76" width="88" height="46" rx="10" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" filter="url(#cs)"/>
  <text x="192" y="104" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">imc-plan</text>

  <rect x="262" y="76" width="112" height="46" rx="10" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" filter="url(#cs)"/>
  <text x="318" y="104" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">content-create</text>

  <rect x="400" y="76" width="96" height="46" rx="10" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" filter="url(#cs)"/>
  <text x="448" y="104" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">attribution</text>

  <line x1="122" y1="99" x2="148" y2="99" stroke="#7da8c0" stroke-width="1.8" class="flow" marker-end="url(#ca)"/>
  <line x1="236" y1="99" x2="262" y2="99" stroke="#7da8c0" stroke-width="1.8" class="flow" marker-end="url(#ca)"/>
  <line x1="374" y1="99" x2="400" y2="99" stroke="#7da8c0" stroke-width="1.8" class="flow" marker-end="url(#ca)"/>

  <!-- Standalone -->
  <text x="28" y="144" font-size="9" fill="#7da8c0" font-weight="500">standalone</text>
  <rect x="18" y="152" width="110" height="30" rx="8" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" stroke-dasharray="5 3" opacity="0.85"/>
  <text x="73" y="171" text-anchor="middle" font-size="11" fill="#4a6878" font-weight="500">lp-optimization</text>

  <rect x="140" y="152" width="58" height="30" rx="8" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" stroke-dasharray="5 3" opacity="0.85"/>
  <text x="169" y="171" text-anchor="middle" font-size="11" fill="#4a6878" font-weight="500">seo</text>

  <rect x="210" y="152" width="84" height="30" rx="8" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" stroke-dasharray="5 3" opacity="0.85"/>
  <text x="252" y="171" text-anchor="middle" font-size="11" fill="#4a6878" font-weight="500">humanize</text>

  <rect x="306" y="152" width="90" height="30" rx="8" fill="url(#cn)" stroke="#a8c0d0" stroke-width="1" stroke-dasharray="5 3" opacity="0.85"/>
  <text x="351" y="171" text-anchor="middle" font-size="11" fill="#4a6878" font-weight="500">copywriting</text>
</svg>
