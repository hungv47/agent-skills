<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect width="520" height="180" rx="10" fill="#f0f5f1" stroke="#ccdece" stroke-width="1"/>
  <text x="260" y="24" text-anchor="middle" font-size="11" fill="#7da882" font-weight="600" letter-spacing="0.12em">PROD</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#9ac4a0">plan → architect → build → document</text>

  <!-- Main pipeline -->
  <rect x="16" y="56" width="126" height="42" rx="8" fill="#ffffff" stroke="#a4c4a8" stroke-width="1"/>
  <text x="79" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">plan-interviewer</text>

  <rect x="168" y="56" width="144" height="42" rx="8" fill="#ffffff" stroke="#a4c4a8" stroke-width="1"/>
  <text x="240" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">system-architecture</text>

  <rect x="338" y="56" width="120" height="42" rx="8" fill="#ffffff" stroke="#a4c4a8" stroke-width="1"/>
  <text x="398" y="81" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="500">task-breakdown</text>

  <line x1="142" y1="77" x2="168" y2="77" stroke="#9ac4a0" stroke-width="1.5" marker-end="url(#a4)"/>
  <line x1="312" y1="77" x2="338" y2="77" stroke="#9ac4a0" stroke-width="1.5" marker-end="url(#a4)"/>

  <!-- Standalone -->
  <text x="28" y="124" font-size="9" fill="#9ac4a0">standalone</text>
  <rect x="16" y="132" width="104" height="34" rx="7" fill="#ffffff" stroke="#a4c4a8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="68" y="153" text-anchor="middle" font-size="11" fill="#5a8060">code-cleanup</text>

  <rect x="132" y="132" width="116" height="34" rx="7" fill="#ffffff" stroke="#a4c4a8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="190" y="153" text-anchor="middle" font-size="11" fill="#5a8060">technical-writer</text>

  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#9ac4a0" stroke-width="1.5"/>
    </marker>
  </defs>
